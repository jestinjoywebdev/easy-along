<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EaseAlong — Compassionate Companionship for Seniors & Disabled</title>
    <link rel="icon" href="./eassyAlong.ico" type="image/x-icon">
    <meta name="description" content="Trusted young companions with police clearance & training. Serving seniors and disabled individuals across all districts of Kerala." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@11.2.12/dist/framer-motion.umd.js"></script>
    <script type="module">

    <style>

        }
        .fade-in {
            animation: fadeIn 0.6s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }

<body class="min-h-screen bg-gradient-to-br from-blue-50 to-teal-50">

    <!--

                        <line x1="6" y1="6" x2="18" y2="18"></line>

                <input type="tel" id="leadPhone" placeholder="Phone (WhatsApp)" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent" required>

                <div class="pt-2">
                    <button id="submitLead" class="w-full bg-teal-600 hover:bg-teal-700 text-white py-3 px-4 rounded-lg font-semibold transition-colors">
                        Book a Free 15-Min Consultation
                    </button>
                </div>
                <p class="text-xs text-gray-500 text-center mt-2">
                    Or message us directly on WhatsApp — we reply fast!
                </p>
            </div>
        </div>
    </div>

    <!-- 
        ✅ FULL 3-OPTION MODAL: Triggered only by "Get Started Today" under Services
    -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">

            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-gray-800">How Can We Help You?</h3>

                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div id="mainOptions" class="space-y-4">
                <button id="btnClient" class="w-full p-4 bg-gradient-to-r from-blue-50 to-blue-100 border border-blue-200 rounded-lg text-left hover:bg-blue-100 transition-colors">
                    <h4 class="font-semibold text-blue-800">I'm Seeking Companion Services</h4>
                    <p class="text-sm text-blue-600 mt-1">For my parent or loved one</p>
                </button>
                <button id="btnJobSeeker" class="w-full p-4 bg-gradient-to-r from-green-50 to-green-100 border border-green-200 rounded-lg text-left hover:bg-green-100 transition-colors">
                    <h4 class="font-semibold text-green-800">I Want to Become a Companion</h4>
                    <p class="text-sm text-green-600 mt-1">Join our trusted team</p>

                <button id="btnEnquiry" class="w-full p-4 bg-gradient-to-r from-purple-50 to-purple-100 border border-purple-200 rounded-lg text-left hover:bg-purple-100 transition-colors">
                    <h4 class="font-semibold text-purple-800">I Have a General Question</h4>
                    <p class="text-sm text-purple-600 mt-1">Message us on WhatsApp</p>
                </button>
            </div>

            <!-- Client Form -->
            <div id="clientForm" class="hidden space-y-4">
                <h4 class="font-semibold text-gray-800">Tell Us About Your Loved One</h4>
                <input type="text" id="clientName" placeholder="Your Full Name" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                <input type="email" id="clientEmail" placeholder="Email Address" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                <input type="tel" id="clientPhone" placeholder="Phone (WhatsApp)" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                <input type="text" id="clientCity" placeholder="City in Kerala" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                <div class="flex gap-3 pt-4">
                    <button id="submitClient" class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700">Submit</button>
                    <button id="backFromClient" class="flex-1 border border-gray-300 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-100">Back</button>
                </div>
            </div>

            <!-- Job Seeker Form -->
            <div id="jobSeekerForm" class="hidden space-y-4">
                <h4 class="font-semibold text-gray-800">Apply to Be a Companion</h4>
                <input type="text" id="seekerName" placeholder="Full Name" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" required>
                <select id="jobType" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" required>
                    <option value="" disabled selected>Are you a student or working?</option>
                    <option value="student">Student</option>
                    <option value="working">Working Professional</option>
                </select>
                <input type="email" id="seekerEmail" placeholder="Email Address" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" required>
                <input type="text" id="seekerLocation" placeholder="Your City/Area in Kerala" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" required>
                <div class="flex gap-3 pt-4">
                    <button id="submitJobSeeker" class="flex-1 bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700">Submit</button>
                    <button id="backFromJobSeeker" class="flex-1 border border-gray-300 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-100">Back</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        const { Phone, Clock, Heart, Users, MapPin, Calendar, ArrowRight, Menu, X } = window.LucideIcons;

        const companions = [
            { id: 1, name: "Anjali Nair", age: 27, experience: "4 years", specialties: ["Medical Appointments", "Hospital Support", "Leisure Walks"], bio: "I believe every senior deserves joyful, safe outings." },
            { id: 2, name: "Rahul Menon", age: 30, experience: "5 years", specialties: ["Shopping", "Errands", "Companionship"], bio: "Former caregiver. Passionate about dignity in aging." },
            { id: 3, name: "Sneha Pillai", age: 25, experience: "3 years", specialties: ["Daily Outings", "Social Trips", "Medical Visits"], bio: "Warm, patient, and always on time." }
        ];

        // 🔁 REPLACE WITH YOUR ACTUAL WHATSAPP NUMBER (e.g., "919876543210")
        const WHATSAPP_NUMBER = "919876543210";

        // --- Utility Functions ---
        function scrollToSection(sectionId) {
            const el = document.getElementById(sectionId);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
            if (window.innerWidth < 768) closeMobileMenu();
        }

        let isMenuOpen = false;
        function toggleMobileMenu() {
            isMenuOpen = !isMenuOpen;
            const menu = document.getElementById('mobile-menu');
            if (isMenuOpen) {
                menu.classList.remove('hidden');
                menu.classList.add('fade-in');
            } else {
                menu.classList.add('hidden');
            }
        }
        function closeMobileMenu() {
            isMenuOpen = false;
            document.getElementById('mobile-menu')?.classList.add('hidden');
        }

        // --- Modal Functions ---
        function openLeadModal() {
            document.getElementById('leadModal').classList.remove('hidden');
        }
        function closeLeadModal() {
            document.getElementById('leadModal').classList.add('hidden');
        }
        function submitLeadForm() {
            const name = document.getElementById('leadName').value.trim();
            const phone = document.getElementById('leadPhone').value.trim();
            const city = document.getElementById('leadCity').value.trim();
            if (!name || !phone || !city) {
                alert("Please fill in all fields.");
                return;
            }
            alert("Thank you! We’ll call you within 15 minutes.");
            closeLeadModal();
        }

        function openThreeOptionModal() {
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('mainOptions').classList.remove('hidden');
            document.getElementById('clientForm').classList.add('hidden');
            document.getElementById('jobSeekerForm').classList.add('hidden');
        }
        function closeThreeOptionModal() {
            document.getElementById('modal').classList.add('hidden');
        }
        function showClientForm() {
            document.getElementById('mainOptions').classList.add('hidden');
            document.getElementById('clientForm').classList.remove('hidden');
        }
        function showJobSeekerForm() {
            document.getElementById('mainOptions').classList.add('hidden');
            document.getElementById('jobSeekerForm').classList.remove('hidden');
        }
        function backToMainOptions() {
            document.getElementById('mainOptions').classList.remove('hidden');
            document.getElementById('clientForm').classList.add('hidden');
            document.getElementById('jobSeekerForm').classList.add('hidden');
        }
        function submitClientForm() {
            alert("Thank you! We'll contact you soon.");
            closeThreeOptionModal();
        }
        function submitJobSeekerForm() {
            alert("Thank you for your interest! We'll review your application.");
            closeThreeOptionModal();
        }
        function openWhatsAppEnquiry() {
            const msg = encodeURIComponent("Hello, I have an enquiry about EaseAlong services.");
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, '_blank');
            closeThreeOptionModal();
        }

        // --- Render Functions ---
        function renderNav() {
            return `
                <nav class="fixed top-0 w-full bg-white/90 backdrop-blur-sm shadow-sm z-50">

                        <div class="flex justify-between items-center h-16">
                            <div class="flex items-center cursor-pointer" id="nav-home">
    <img src="./ea.png" alt="EaseAlong Logo" class="h-12 md:h-16 w-auto mr-2" />
    <span class="text-2xl font-bold text-gray-800">EaseAlong</span>
</div>
                            <div class="hidden md:block">
                                <div class="ml-10 flex items-baseline space-x-8">

                                </div>
                            </div>
                            <a href="https://wa.me/${WHATSAPP_NUMBER}" target="_blank" class="hidden md:flex items-center bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-full">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
                                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>

                                        <line x1="3" y1="6" x2="21" y2="6"></line>
                                        <line x1="3" y1="18" x2="21" y2="18"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                            <button id="mobile-about" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-teal-600 hover:bg-gray-50">About</button>
                            <button id="mobile-services" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-teal-600 hover:bg-gray-50">Services</button>
                            <button id="mobile-companions" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-teal-600 hover:bg-gray-50">Companions</button>

                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">

                                </svg>
                                WhatsApp Us
                            </a>
                        </div>
                    </div>
                </nav>
            `;
        }

        // 
        // ✅ HERO SECTION: Background unchanged, buttons updated
        //
        function renderHero() {
            return `
                <section id="home" class="pt-16 min-h-screen flex items-center bg-cover bg-center bg-fixed" style="background-image: url('./home.jpg');">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 rounded-xl ml-4 mr-4 text-black">

                                        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/>

                    </div>

                'users': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
                'clock': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
                'phone': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>'
            };

            let html = services.map(s => `
                <div class="bg-white p-6 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300">
                    <div class="w-12 h-12 bg-teal-100 text-teal-600 rounded-lg flex items-center justify-center mb-4">
                        ${iconMap[s.icon]}
                    </div>
                    <h3 class="text-xl font-semibold text-gray-800 mb-2">${s.title}</h3>
                    <p class="text-gray-600">${s.desc}</p>
                </div>
            `).join('');

            return `
                <section id="services" class="py-20 bg-gradient-to-br from-gray-50 to-blue-50">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="text-center mb-16">
                            <h2 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">Our Services</h2>
                            <p class="text-xl text-gray-600 max-w-3xl mx-auto">
                                From medical appointments to leisurely park walks, we're here to make every outing safe, comfortable, and enjoyable across Kerala.
                            </p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            ${html}
                        </div>
                        <div class="text-center mt-12">
                            <button id="getStartedBtn" class="inline-flex items-center bg-green-500 hover:bg-green-600 text-white px-8 py-3 rounded-full font-semibold transition-colors duration-200">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
                                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                                </svg>
                                Get Started Today
                            </button>
                        </div>
                    </div>
                </section>
            `;
        }

        // 
        // ✅ NEW SECTION: Our Recruitment Process
        //
        function renderRecruitment() {
            return `
                <section class="py-20 bg-white">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="text-center mb-16">
                            <h2 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">Our Recruitment Process</h2>
                            <p class="text-xl text-gray-600 max-w-3xl mx-auto">
                                Your loved one’s safety is our highest priority. Here’s how we ensure every companion is trustworthy and capable.
                            </p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div class="bg-blue-50 p-6 rounded-xl border border-blue-100">
                                <div class="text-teal-600 mb-4">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/>
                                    </svg>
                                </div>
                                <h3 class="text-xl font-semibold text-gray-800 mb-2">Police Verification</h3>
                                <p class="text-gray-600">Every applicant undergoes mandatory police background clearance before joining our team.</p>
                            </div>
                            <div class="bg-blue-50 p-6 rounded-xl border border-blue-100">
                                <div class="text-teal-600 mb-4">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                                    </svg>
                                </div>
                                <h3 class="text-xl font-semibold text-gray-800 mb-2">Local Youth from Kerala</h3>
                                <p class="text-gray-600">We hire compassionate, responsible young adults from all districts of Kerala who understand local needs and culture.</p>
                            </div>
                            <div class="bg-blue-50 p-6 rounded-xl border border-blue-100">
                                <div class="text-teal-600 mb-4">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                                    </svg>
                                </div>
                                <h3 class="text-xl font-semibold text-gray-800 mb-2">Empathy & Care Training</h3>
                                <p class="text-gray-600">All companions complete a training program in senior care, communication, emergency response, and dignity-first support.</p>
                            </div>
                        </div>
                        <div class="text-center mt-10 text-gray-600">
                            <p class="italic">Plus: 24/7 WhatsApp support and a dedicated care coordinator for every family.</p>
                        </div>
                    </div>
                </section>
            `;
        }

        function renderCompanions() {
            let html = companions.map(c => {
                const initials = c.name.split(' ').map(n => n[0]).join('');
                const specialties = c.specialties.map(s => 
                    `<span class="bg-white text-teal-600 px-2 py-1 rounded-full text-xs font-medium">${s}</span>`
                ).join('');
                return `
                    <div class="bg-gradient-to-br from-blue-50 to-teal-50 rounded-xl overflow-hidden shadow-sm hover:shadow-lg transition-shadow duration-300">
                        <div class="p-6">
                            <div class="flex items-center mb-4">
                                <div class="w-14 h-14 bg-gradient-to-br from-teal-400 to-teal-600 rounded-full flex items-center justify-center text-white font-bold text-lg">
                                    ${initials}
                                </div>
                                <div class="ml-4">
                                    <h3 class="text-lg font-semibold text-gray-800">${c.name}</h3>
                                    <p class="text-gray-600 text-sm">${c.experience}</p>
                                </div>
                            </div>
                            <p class="text-gray-700 mb-4 text-sm">${c.bio}</p>
                            <div class="flex flex-wrap gap-2">
                                ${specialties}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            return `
                <section id="companions" class="py-20 bg-white">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="text-center mb-16">
                            <h2 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">Meet Our Companions</h2>
                            <p class="text-xl text-gray-600 max-w-3xl mx-auto">
                                Our carefully selected companions are more than helpers—they're friends who bring warmth, reliability, and joy to every interaction.
                            </p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            ${html}
                        </div>
                    </div>
                </section>
            `;
        }

        function renderFooter() {
            return `
                <footer class="bg-gray-800 text-white py-12">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
                            <div class="md:col-span-2">
                                <div class="flex items-center mb-4">
                                     <img src="./ea.png" alt="EaseAlong Logo" class="h-10 md:h-16 w-auto" />
                                    <span class="ml-2 text-2xl font-bold">EaseAlong</span>
                                </div>
                                <p class="text-gray-300 leading-relaxed">
                                    Providing compassionate, police-verified companionship to seniors and individuals with mobility needs across all districts of Kerala.
                                </p>
                            </div>
                            <div>
                                <h3 class="text-lg font-semibold mb-4">Quick Links</h3>
                                <ul class="space-y-2 text-gray-300">
                                    <li><button id="footer-home">Home</button></li>
                                    <li><button id="footer-about">About Us</button></li>
                                    <li><button id="footer-services">Services</button></li>
                                    <li><button id="footer-companions">Companions</button></li>
                                </ul>
                            </div>
                            <div>
                                <h3 class="text-lg font-semibold mb-4">Contact</h3>
                                <div class="space-y-3">
                                    <a href="https://wa.me/${WHATSAPP_NUMBER}" target="_blank" class="flex items-center text-gray-300 hover:text-teal-400 transition-colors">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
                                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                                        </svg>
                                        WhatsApp Us
                                    </a>
                                    <p class="text-gray-300">Available 24/7 for your support needs</p>
                                </div>
                            </div>
                        </div>
                        <div class="border-t border-gray-700 mt-8 pt-8 text-center text-gray-400">
                            <p>&copy; 2025 EaseAlong. All rights reserved. Making every journey easier, together.</p>
                        </div>
                    </div>
                </footer>
            `;
        }

        function renderApp() {
            document.getElementById('root').innerHTML = `
                ${renderNav()}
                ${renderHero()}
                ${renderAbout()}
                ${renderServices()}
                ${renderRecruitment()} <!-- ✅ NEW SECTION INSERTED HERE -->
                ${renderCompanions()}
                ${renderFooter()}
            `;
        }

        function bindEvents() {
            // Navigation
            document.getElementById('nav-home')?.addEventListener('click', () => scrollToSection('home'));
            ['home','about','services','companions'].forEach(id => {
                document.getElementById(`nav-${id}-btn`)?.
                    addEventListener('click', () => scrollToSection(id));
                document.getElementById(`mobile-${id}`)?.
                    addEventListener('click', () => scrollToSection(id));
                document.getElementById(`footer-${id}`)?.
                    addEventListener('click', () => scrollToSection(id));
            });
            document.getElementById('mobile-menu-toggle')?.addEventListener('click', toggleMobileMenu);

            // Hero: Book Free Consultation
            document.getElementById('hero-lead-btn')?.addEventListener('click', openLeadModal);

            // Services: Get Started → 3-Option Modal
            document.getElementById('getStartedBtn')?.addEventListener('click', openThreeOptionModal);

            // Lead Modal
            document.getElementById('closeLeadModalBtn')?.addEventListener('click', closeLeadModal);
            document.getElementById('submitLead')?.addEventListener('click', submitLeadForm);

            // 3-Option Modal
            document.getElementById('closeModalBtn')?.addEventListener('click', closeThreeOptionModal);
            document.getElementById('btnClient')?.addEventListener('click', showClientForm);
            document.getElementById('btnJobSeeker')?.addEventListener('click', showJobSeekerForm);
            document.getElementById('btnEnquiry')?.addEventListener('click', openWhatsAppEnquiry);
            document.getElementById('submitClient')?.addEventListener('click', submitClientForm);
            document.getElementById('submitJobSeeker')?.addEventListener('click', submitJobSeekerForm);
            document.getElementById('backFromClient')?.addEventListener('click', backToMainOptions);
            document.getElementById('backFromJobSeeker')?.addEventListener('click', backToMainOptions);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
            bindEvents();
        });
    </script>
</body>
</html>
